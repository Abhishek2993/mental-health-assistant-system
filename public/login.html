<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237fd1b9'/%3E%3Cstop offset='.5' stop-color='%237aa7e0'/%3E%3Cstop offset='1' stop-color='%23b39ddb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..600,100&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
<script>try { document.documentElement.dataset.mood = localStorage.getItem('aurora-mood') || 'okay'; } catch (e) {}</script>
<title>Sign in — Aurora</title>
</head>
<body>
<header id="nav" class="nav"></header>
<main class="auth-wrap">
  <form class="card auth-card" id="login" data-role="user">
    <h2>Welcome back 🌿</h2>
    <p class="muted">Good to see you again. Take a breath — you're in a safe space.</p>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <p class="error hidden" id="error" role="alert"></p>
    <button class="btn block" type="submit">Sign in</button>
    <p class="role-switch">New here? <a href="/signup.html">Create your space</a></p>
    <p class="role-switch">Are you a therapist? <a href="/therapist/login.html">Use the therapist sign-in →</a></p>
  </form>
</main>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
