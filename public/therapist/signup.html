<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237fd1b9'/%3E%3Cstop offset='.5' stop-color='%237aa7e0'/%3E%3Cstop offset='1' stop-color='%23b39ddb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..600,100&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../css/style.css">
<script>try { document.documentElement.dataset.mood = localStorage.getItem('aurora-mood') || 'okay'; } catch (e) {}</script>
<title>Register as a therapist — Aurora</title>
</head>
<body>
<header id="nav" class="nav"></header>
<main class="auth-wrap">
  <form class="card auth-card" id="signup" novalidate>
    <span class="portal-badge">Therapist portal</span>
    <h2 style="margin-top:12px">Register your practice</h2>
    <p class="muted">People using Aurora can find you and request an in-person session. When they book, they choose to share their wellbeing data with you.</p>
    <div class="field"><label for="name">Full name</label><input id="name" type="text" placeholder="Dr. …" required></div>
    <div class="field"><label for="email">Work email</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><div class="hint">At least 8 characters.</div></div>
    <div class="grid grid-2" style="gap:0 16px">
      <div class="field"><label for="license">Registration / licence no.</label><input id="license" type="text" placeholder="e.g. RCI number" required></div>
      <div class="field"><label for="years">Years of experience</label><input id="years" type="number" min="0" max="60" value="1"></div>
    </div>
    <div class="field"><label for="spec">Specialisation</label><input id="spec" type="text" placeholder="e.g. Anxiety, depression, adolescents" required></div>
    <div class="field"><label for="city">City</label><input id="city" type="text" required></div>
    <div class="field"><label for="address">Clinic address (for in-person sessions)</label><textarea id="address" rows="2" style="min-height:70px" required></textarea></div>
    <div class="field"><label for="bio">Short bio <span class="muted">(optional)</span></label><textarea id="bio" rows="3" style="min-height:90px"></textarea></div>
    <p class="error hidden" id="error" role="alert"></p>
    <button class="btn block" type="submit">Create therapist account</button>
    <p class="role-switch">Already registered? <a href="/therapist/login.html">Sign in</a></p>
  </form>
</main>
<script src="../js/common.js"></script>
<script>
  boot().then(me => { if (me.user) location.href = me.user.role === 'therapist' ? '/therapist/dashboard.html' : '/home.html'; });
  $('#signup').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#signup button[type=submit]');
    btn.disabled = true;
    try {
      const { redirect } = await api('/auth/therapist/signup', {
        method: 'POST',
        body: {
          name: $('#name').value, email: $('#email').value, password: $('#password').value,
          license_no: $('#license').value, years_experience: $('#years').value, specialization: $('#spec').value,
          city: $('#city').value, clinic_address: $('#address').value, bio: $('#bio').value,
        },
      });
      location.href = redirect;
    } catch (err) {
      $('#error').textContent = err.message;
      $('#error').classList.remove('hidden');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
